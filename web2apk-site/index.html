<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web2Apk</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>:root{--ink:#111;--bg:#F2E8D5;--pap:#FFF8EA;--y:#E8B931;--c:#D96C52;--g:#86B49A;--b:#8DAFD6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.5 'Space Grotesk',system-ui,sans-serif;padding:16px}
main{max-width:780px;margin:auto;display:grid;gap:20px}
h1{font:800 clamp(28px,7vw,44px)/1.1 'Space Grotesk',system-ui,sans-serif;margin:8px 0;background:var(--y);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:10px 16px;justify-self:start;transform:rotate(-1deg)}
.card{background:var(--pap);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--ink);padding:16px}
h2{margin:0 0 8px;font-size:19px}
label{display:block;font-weight:700;margin:10px 0 4px;font-size:13px}
input,select{width:100%;padding:10px;border:3px solid var(--ink);background:#fff;font:inherit;border-radius:0}
input:focus,select:focus,button:focus-visible{outline:none;box-shadow:4px 4px 0 var(--ink)}
button{font:inherit;font-weight:800;padding:10px 16px;border:3px solid var(--ink);background:var(--g);box-shadow:4px 4px 0 var(--ink);cursor:pointer;margin:12px 8px 0 0}
button:active{transform:translate(4px,4px);box-shadow:none}button:disabled{opacity:.45;cursor:not-allowed}
.y{background:var(--y)}.c{background:var(--c)}.b{background:var(--b)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.row{grid-template-columns:1fr}}
.tag{display:inline-block;border:2px solid var(--ink);padding:2px 8px;font-weight:800;background:var(--y)}
pre{background:var(--ink);color:#F2E8D5;padding:12px;overflow:auto;max-height:240px;white-space:pre-wrap;margin:12px 0 0}
a{color:var(--ink);font-weight:800}.hide{display:none!important}.msg{margin-top:10px;font-weight:700}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border:2px solid var(--ink);padding:6px;text-align:left}th{background:var(--y)}td button{margin:2px;padding:4px 8px;box-shadow:2px 2px 0 var(--ink)}
.sc{overflow-x:auto;max-width:100%}main,#panel{grid-template-columns:minmax(0,1fr)}.card{min-width:0}td{word-break:break-word}
</style></head>
<body><main>
<h1>WEB2APK FREE</h1>
<section class="card"><h2>1. Koneksi GitHub</h2>
<p>Ketik nama repo baru: dibuat otomatis dari template. Token butuh scope <b>repo</b> + <b>workflow</b>. <span id="tl"></span></p>
<div class="row"><div><label>Username GitHub</label><input id="u" autocomplete="off"></div><div><label>Nama repo</label><input id="r" autocomplete="off"></div></div>
<label>Token (scope repo + workflow)</label><input id="t" type="password" autocomplete="off">
<button id="test" class="y">Tes koneksi</button><button id="save" disabled>Simpan</button>
<div id="cm" class="msg"></div></section>

<section class="card"><h2>2. Buat APK</h2>
<div class="row"><div><label>Nama aplikasi</label><input id="an" value="Web App"></div>
<div><label>Package name</label><input id="pk" readonly></div></div>
<label>Icon (PNG/JPG, opsional)</label><input id="ic" type="file" accept="image/*">
<label>Sumber</label><select id="mode"><option value="url">URL website (utama)</option><option value="html">File HTML tunggal</option></select>
<div id="m-url"><label>URL</label><input id="url" placeholder="https://contoh.com/"></div>
<div id="m-file" class="hide"><label id="fl">File</label><input id="file" type="file"></div>
<button id="go" class="y">Buat APK</button>
<div id="free" class="msg">Versi FREE: package otomatis, APK kedaluwarsa 7 hari sejak dibuat. Mau tanpa batas waktu, ZIP, dan package bebas? <a href="https://web2apk-nyr-prem.vercel.app">Upgrade ke Premium</a></div>
<pre id="log" class="hide"></pre><div id="res" class="msg"></div></section>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
const app=initializeApp({apiKey:"AIzaSyB66pSX6CeycLm42ibclmJiDFLvIXOQ3Ok",authDomain:"webtoapk-project1.firebaseapp.com",projectId:"webtoapk-project1",storageBucket:"webtoapk-project1.firebasestorage.app",messagingSenderId:"108573284292",appId:"1:108573284292:web:de980fd329db639a92f691",measurementId:"G-F96M1C8YDP"});
import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const db=getFirestore(app),$=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const ls=(k,v)=>v===undefined?JSON.parse(localStorage.getItem(k)||'null'):v===null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v));
let gh=ls('gh')||{},cfg={};
const msg=(s,t)=>$(s).textContent=t,log=t=>{const p=$('#log');p.classList.remove('hide');p.textContent+=t+'\n';p.scrollTop=1e9};
const b64=u=>{let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const api=async(p,m='GET',body)=>{const r=await fetch('https://api.github.com'+p,{method:m,headers:{Authorization:'Bearer '+gh.token,Accept:'application/vnd.github+json'},body:body&&JSON.stringify(body)});if(!r.ok){let e='';try{e=(await r.json()).message}catch{}throw Error(r.status+' '+e)}return r.status==204?null:r.json()};
const mk=(t,p={},...k)=>{const e=document.createElement(t);Object.assign(e,p);e.append(...k);return e};
const slug=n=>{let s=n.toLowerCase().replace(/[^a-z0-9]/g,'');if(!s||!/[a-z]/.test(s[0]))s='app'+s;return s.slice(0,30)};

function refresh(){
  $('#u').value=gh.user||'';$('#r').value=gh.repo||'';$('#t').value=gh.token||'';
  
  const t=cfg.freeTemplate;
  $('#tl').replaceChildren(...(t&&/^https:\/\/github\.com\//.test(t)?[mk('a',{href:t.replace(/\/$/,'')+'/generate',target:'_blank',textContent:'Buat repo dari template ↗'})]:[]));
  pkg();
}
const pkg=()=>{$('#pk').value='com.webapp.nyr.'+slug($('#an').value)};
$('#an').oninput=pkg;
$('#mode').onchange=()=>{const m=$('#mode').value;$('#m-url').classList.toggle('hide',m!=='url');$('#m-file').classList.toggle('hide',m==='url');$('#fl').textContent=m==='zip'?'File ZIP (index.html harus di paling depan)':'File HTML';$('#file').accept=m==='zip'?'.zip':'.html,.htm'};

$('#test').onclick=async()=>{
  gh={user:$('#u').value.trim(),token:$('#t').value.trim(),repo:$('#r').value.trim()};$('#save').disabled=true;msg('#cm','Mengetes...');
  try{
    if(!/^[\w.-]{1,100}$/.test(gh.repo))throw Error('Nama repo hanya boleh huruf, angka, titik, minus, underscore');
    const me=await api('/user');if(me.login.toLowerCase()!==gh.user.toLowerCase())throw Error('Token milik akun '+me.login+', bukan '+gh.user);
    const U=`/repos/${gh.user}/${gh.repo}`;let rp,created=false;
    try{rp=await api(U)}catch(e){
      if(!e.message.startsWith('404'))throw e;
      const m=String(cfg.freeTemplate||'').match(/github\.com\/([\w.-]+)\/([\w.-]+)/);
      if(!m)throw Error('Repo belum ada dan link template belum diatur admin');
      msg('#cm','Repo belum ada, membuat otomatis dari template...');
      try{await api(`/repos/${m[1]}/${m[2].replace(/\.git$/,'')}/generate`,'POST',{owner:gh.user,name:gh.repo,private:false,description:'Web2Apk'})}
      catch(e2){throw Error('Gagal membuat repo dari template ('+e2.message+'). Pastikan template public, sudah dicentang Template repository, dan token punya scope repo + workflow')}
      created=true;rp=null;
      for(let i=0;i<20&&!rp;i++){await sleep(2000);try{rp=await api(U)}catch(_){}}
      if(!rp)throw Error('Repo dibuat tapi belum siap, tekan Tes koneksi lagi sebentar lagi');
    }
    if(!rp.permissions||!rp.permissions.push)throw Error('Token tidak punya akses push ke repo');
    let w;for(let i=0;i<(created?15:1)&&!w;i++){try{w=(await api(U+'/actions/workflows')).workflows.find(x=>x.path.endsWith('build-apk.yml'))}catch(_){}if(!w&&created)await sleep(2000)}
    if(!w)throw Error('Workflow build-apk.yml tidak ditemukan di repo (template belum berisi folder .github?)');if(w.state!=='active')throw Error('Workflow belum aktif (aktifkan di tab Actions)');
    gh.branch=rp.default_branch;$('#save').disabled=false;msg('#cm',(created?'✔ Repo baru dibuat dari template: ':'✔ Terkoneksi ke ')+rp.full_name+', workflow aktif. Silakan simpan.');
  }catch(e){msg('#cm','✘ '+e.message)}};

$('#save').onclick=()=>{ls('gh',gh);msg('#cm','✔ Tersimpan di browser ini')};

const toPng=f=>new Promise((ok,no)=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d'),s=Math.min(i.width,i.height);x.drawImage(i,(i.width-s)/2,(i.height-s)/2,s,s,0,0,512,512);ok(c.toDataURL('image/png').split(',')[1])};i.onerror=()=>no(Error('Icon tidak valid'));i.src=URL.createObjectURL(f)});

// Unduh lewat API + token: jalan juga untuk repo private (link browser_download_url bisa 404)
async function dl(R,a){try{log('Mengunduh APK...');const r=await fetch('https://api.github.com'+R+'/releases/assets/'+a.id,{headers:{Authorization:'Bearer '+gh.token,Accept:'application/octet-stream'}});if(!r.ok)throw Error(r.status);const l=document.createElement('a');l.href=URL.createObjectURL(await r.blob());l.download=($('#an').value.trim()||'app').replace(/[^\w.-]+/g,'_')+'.apk';document.body.appendChild(l);l.click();l.remove();log('Terunduh ✔')}catch(e){log('Unduh langsung gagal ('+e.message+'), membuka link GitHub...');window.open(a.browser_download_url,'_blank')}}
$('#go').onclick=async()=>{
  $('#go').disabled=true;$('#log').textContent='';msg('#res','');
  try{
    if(!gh.token||!gh.branch)throw Error('Simpan koneksi GitHub dulu (tes koneksi → simpan)');
    const name=$('#an').value.trim()||'Web App',mode=$('#mode').value,R=`/repos/${gh.user}/${gh.repo}`,enc=new TextEncoder(),F={};
    let pk='';
    
    const rn=new URL('../',location.href).href;
    F['config/app.json']=enc.encode(JSON.stringify({appName:name},null,2));
    if($('#ic').files[0])F['config/icon.png']=Uint8Array.from(atob(await toPng($('#ic').files[0])),c=>c.charCodeAt(0));
    if(mode==='url'){
      const u=$('#url').value.trim();if(!/^https?:\/\/\S+$/.test(u))throw Error('URL harus diawali http:// atau https://');
      const a=u.replace(/&/g,'&amp;').replace(/'/g,'%27').replace(/"/g,'%22');
      F['www/url.txt']=enc.encode(u);
      const T='<',w=(t,x='')=>T+t+x+'>';  // tag dirakit dari potongan: tidak ada tag HTML/meta-refresh literal di source halaman ini
      F['www/index.html']=enc.encode(T+'!DOCTYPE html>\n'+w('html')+w('head')+w('meta',' name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"')+w('meta',' http-equiv="Refresh" content="0; url=\''+a+'\'"')+w('script')+'window.location.replace('+JSON.stringify(u).replace(/</g,'\\u003c')+');'+T+'/script>'+T+'/head>'+w('body',' style="margin:0;display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif"')+'Redirecting...'+T+'/body>'+T+'/html>');
    }else{
      const f=$('#file').files[0];if(!f)throw Error('Pilih file dulu');F['www/url.txt']=enc.encode('');
      F['www/index.html']=new Uint8Array(await f.arrayBuffer());
    }
    const bid=Date.now().toString(36),br=gh.branch;
    log('Membaca repo...');
    const ref=await api(`${R}/git/ref/heads/${br}`),bc=await api(`${R}/git/commits/${ref.object.sha}`),old=await api(`${R}/git/trees/${bc.tree.sha}?recursive=1`);
    const paths=Object.keys(F),tree=[];log('Upload '+paths.length+' file...');
    for(let i=0;i<paths.length;i+=6)await Promise.all(paths.slice(i,i+6).map(async p=>{const b=await api(`${R}/git/blobs`,'POST',{content:b64(F[p]),encoding:'base64'});tree.push({path:p,mode:'100644',type:'blob',sha:b.sha})}));
    old.tree.filter(x=>x.type==='blob'&&x.path.startsWith('www/')&&!F[x.path]).forEach(x=>tree.push({path:x.path,mode:'100644',type:'blob',sha:null}));
    const nt=await api(`${R}/git/trees`,'POST',{base_tree:bc.tree.sha,tree}),nc=await api(`${R}/git/commits`,'POST',{message:'web2apk: '+name,tree:nt.sha,parents:[ref.object.sha]});
    await api(`${R}/git/refs/heads/${br}`,'PATCH',{sha:nc.sha});
    const t0=Date.now();log('Menjalankan workflow...');
    await api(`${R}/actions/workflows/build-apk.yml/dispatches`,'POST',{ref:br,inputs:{build_id:bid}});
    while(Date.now()-t0<15*60000){
      await sleep(8000);
      const rs=await api(`${R}/releases?per_page=10`),rel=rs.find(r=>(r.body||'').includes('build_id: '+bid)&&r.assets.length);
      if(rel){const a=rel.assets[0];log('Selesai ✔');$('#res').replaceChildren(mk('button',{id:'dl',textContent:'⬇ Unduh APK'}),' ',mk('a',{href:rel.html_url,target:'_blank',textContent:'Buka di GitHub ↗'}),...([' ',mk('span',{className:'tag',textContent:'Kedaluwarsa: '+new Date(Date.now()+7*864e5).toLocaleDateString('id-ID')})]));$('#dl').onclick=()=>dl(R,a);return}
      const ru=(await api(`${R}/actions/runs?event=workflow_dispatch&per_page=5`)).workflow_runs.find(x=>new Date(x.created_at)>=t0-15000);
      if(ru&&ru.conclusion&&ru.conclusion!=='success')throw Error('Workflow gagal: '+ru.html_url);
      log('Building... ('+(ru?ru.status:'menunggu runner')+')');
    }
    throw Error('Timeout, cek tab Actions di repo');
  }catch(e){msg('#res','✘ '+e.message)}finally{$('#go').disabled=false}
};

try{const s=await getDoc(doc(db,'settings','config'));if(s.exists())cfg=s.data()}catch(e){}
refresh();
</script></body></html>
